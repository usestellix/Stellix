name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions pinned by commit SHA (SECURITY §8); tag in the trailing comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: scripts/check-no-console.sh
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-manifest.mjs
      - run: node scripts/check-bundle.mjs

  # The marketing site (stellix-demo/): its own pnpm root, lockfile and toolchain. Everything
  # it needs comes from inside that folder, so the job moves with it.
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: stellix-demo
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: stellix-demo/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: stellix-demo/.nvmrc
          cache: pnpm
          cache-dependency-path: stellix-demo/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      # The vendored privacy policy must match the extension's PRIVACY.md. TODO: compare with the
      # release tag (v0.1.0) once it exists, not this commit.
      - run: pnpm sync:privacy --repo .. --ref HEAD --check
      - run: pnpm build
      - run: pnpm check:copy

  # SECURITY §8: no committed secrets anywhere in history, every branch and tag included.
  # gitleaks is a release binary, pinned by version and verified against its published
  # SHA-256 (8.30.1, 2026-03-21). Not gitleaks-action: it needs a licence key for org repos.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - run: ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="--all" .

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Playwright's image ships Chromium and its system libraries, so no apt step: installing
    # them with `--with-deps` from the Azure Ubuntu mirror ran past the job timeout. Pinned by
    # digest (SECURITY §8); its tag must match @playwright/test in apps/extension/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/extension/playwright-report
          retention-days: 7

  # ADR 0008: the default build is testnet-only, so the mainnet-switch flows run against a
  # separate STELLIX_MAINNET_ENABLED=true build. Its bundle check expects the mainnet UI.
  e2e-mainnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Playwright's image ships Chromium and its system libraries, so no apt step: installing
    # them with `--with-deps` from the Azure Ubuntu mirror ran past the job timeout. Pinned by
    # digest (SECURITY §8); its tag must match @playwright/test in apps/extension/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:mainnet
      - run: node scripts/check-bundle.mjs
        env:
          STELLIX_MAINNET_ENABLED: "true"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-mainnet
          path: apps/extension/playwright-report
          retention-days: 7

  # SECURITY §9.3: same commit + lockfile → same zip. Two independent runners build the store
  # zip; `reproducible` fails if the hashes differ and lists the files that changed.
  zip:
    strategy:
      matrix:
        build: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm zip
      - run: node scripts/release-hashes.mjs apps/extension/.output/stellixextension-*-chrome.zip > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zip-${{ matrix.build }}
          path: SHA256SUMS
          retention-days: 7

  reproducible:
    needs: zip
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: hashes
      - run: |
          if diff -u hashes/zip-a/SHA256SUMS hashes/zip-b/SHA256SUMS; then
            echo "Reproducible: both builds match."
          else
            echo "::error::The two builds differ (see the diff above)."
            exit 1
          fi

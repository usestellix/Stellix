name: Release

# SECURITY §9: releases are built only here, from a version tag. This workflow creates a DRAFT
# GitHub release with the store zip and SHA256SUMS. It holds no store credentials: a maintainer
# verifies the hashes, signs the package offline with the upload-signing key and uploads it
# (.github/RELEASE.md), then publishes the draft.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release, nothing else
    env:
      # ADR 0008: 0.x releases are testnet-only. Turning mainnet on is a reviewed change here.
      STELLIX_MAINNET_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Tag matches the extension version
        run: |
          version=$(node -p 'require("./apps/extension/package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/extension/package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: scripts/check-no-console.sh
      - run: pnpm test
      - run: pnpm --filter @stellix/extension exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # The zip is built last, from a clean build, so nothing from the E2E run can leak into it.
      - run: pnpm zip
      - run: node scripts/check-manifest.mjs
      - run: node scripts/check-bundle.mjs
      - name: Hashes and notes
        run: |
          zip=$(ls apps/extension/.output/stellixextension-*-chrome.zip)
          node scripts/release-hashes.mjs "$zip" > SHA256SUMS
          {
            echo "Stellix $GITHUB_REF_NAME, testnet only (ADR 0008)."
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Store zip SHA-256: \`$(head -n1 SHA256SUMS | cut -d' ' -f1)\`"
            echo "- Manifest permissions: storage, alarms"
            echo
            echo "SHA256SUMS lists the zip and every file in it. To check the copy the Chrome Web"
            echo "Store serves, see docs/VERIFY_RELEASE.md."
          } > release-notes.md
          cat release-notes.md
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Stellix $GITHUB_REF_NAME" --notes-file release-notes.md \
            apps/extension/.output/stellixextension-*-chrome.zip SHA256SUMS
